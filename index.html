<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعادة تعيين كلمة المرور - رحلات الجزائر 🇩🇿</title>
  <!-- مكتبة Supabase الرسمية المحدثة -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: linear-gradient(135deg, #0B150F 0%, #12231A 100%);
      color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: rgba(20, 36, 27, 0.98);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 24px;
      padding: 36px 24px;
      width: 100%;
      max-width: 430px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    h2 { font-size: 20px; margin-bottom: 8px; color: #FFFFFF; }
    p.subtitle { font-size: 13px; color: #94A3B8; margin-bottom: 20px; }
    .input-group { margin-bottom: 16px; text-align: right; }
    label { display: block; font-size: 12px; color: #CBD5E1; margin-bottom: 6px; font-weight: 600; }
    input {
      width: 100%;
      padding: 13px 14px;
      background: rgba(11, 21, 15, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 12px;
      color: #FFFFFF;
      font-size: 14px;
      outline: none;
      transition: 0.2s border;
    }
    input:focus { border-color: #10B981; }
    button {
      width: 100%;
      padding: 14px;
      background: #10B981;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.2s background;
    }
    button:hover { background: #059669; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .alert { padding: 14px; border-radius: 12px; font-size: 13px; margin-bottom: 16px; line-height: 1.5; text-align: right; }
    .alert-error { background: rgba(239, 68, 68, 0.2); color: #FCA5A5; border: 1px solid rgba(239, 68, 68, 0.4); }
    .alert-success { background: rgba(16, 185, 129, 0.2); color: #6EE7B7; border: 1px solid rgba(16, 185, 129, 0.4); }
    .alert-info { background: rgba(59, 130, 246, 0.2); color: #93C5FD; border: 1px solid rgba(59, 130, 246, 0.4); }
  </style>
</head>
<body>

  <div class="card">
    <div style="font-size: 44px; margin-bottom: 10px;">🔑🇩🇿</div>
    <h2>تغيير كلمة المرور</h2>
    <p class="subtitle">منصة رحلات الجزائر</p>

    <div id="alertBox" class="alert alert-info">جاري التحقق من صلاحية الرابط... ⏳</div>

    <form id="resetForm" onsubmit="handleReset(event)" style="display: none;">
      <div class="input-group">
        <label for="newPass">كلمة المرور الجديدة</label>
        <input type="password" id="newPass" placeholder="اكتب كلمة المرور الجديدة" required minlength="6">
      </div>

      <div class="input-group">
        <label for="confirmPass">تأكيد كلمة المرور</label>
        <input type="password" id="confirmPass" placeholder="أعد كتابة كلمة المرور" required minlength="6">
      </div>

      <button type="submit" id="submitBtn">حفظ وتحديث كلمة المرور 🚀</button>
    </form>
  </div>

  <script>
    // إعدادات Supabase الخاصة بمشروعك
    const SUPABASE_URL = "https://abzxeetfxnejlurqixun.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFienhlZXRmeG5lamx1cnFpeHVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNTQ5MzIsImV4cCI6MjEwMjczMDkzMn0.7w9NKOvO8yE5sXrjc1uUwLuzvL5uHMFgdm1Uxw1xAUA";

    const { createClient } = window.supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        autoRefreshToken: true,
        persistSession: true,
        detectSessionInUrl: true
      }
    });

    let currentSession = null;

    function showAlert(msg, type) {
      const box = document.getElementById("alertBox");
      box.className = "alert " + type;
      box.innerHTML = msg;
      box.style.display = "block";
    }

    // مراقبة حدث تغيير حالة المصادقة (PASSWORD_RECOVERY)
    supabaseClient.auth.onAuthStateChange(async (event, session) => {
      console.log("Auth Event:", event, session);
      if (event === "PASSWORD_RECOVERY" || session) {
        currentSession = session;
        showAlert("تم التحقق من هويتك بنجاح ✅<br>يرجى إدخال كلمة المرور الجديدة أدناه.", "alert-success");
        document.getElementById("resetForm").style.display = "block";
      }
    });

    // معالجة الروابط عند تحميل الصفحة
    async function checkUrlParams() {
      const hash = window.location.hash;
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get("code");
      const errorDescription = urlParams.get("error_description");

      if (errorDescription) {
        showAlert("⚠️ " + decodeURIComponent(errorDescription), "alert-error");
        return;
      }

      if (code) {
        const { data, error } = await supabaseClient.auth.exchangeCodeForSession(code);
        if (error) {
          showAlert("⚠️ هذا الرابط منتهي الصلاحية أو تم استخدامه مسبقاً. يرجى طلب رابط جديد من التطبيق.", "alert-error");
          return;
        }
        currentSession = data.session;
        showAlert("تم التحقق من هويتك بنجاح ✅<br>يرجى إدخال كلمة المرور الجديدة أدناه.", "alert-success");
        document.getElementById("resetForm").style.display = "block";
        return;
      }

      // إذا لم يكن هناك كود أو هاش بعد ثانية
      setTimeout(async () => {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
          currentSession = session;
          showAlert("تم التحقق من هويتك بنجاح ✅<br>يرجى إدخال كلمة المرور الجديدة أدناه.", "alert-success");
          document.getElementById("resetForm").style.display = "block";
        } else if (!currentSession) {
          showAlert("⚠️ رابط غير صالح أو منتهي الصلاحية.<br>يرجى فتح الرابط مباشرة من البريد الإلكتروني.", "alert-error");
        }
      }, 1200);
    }

    checkUrlParams();

    // حفظ كلمة المرور في قاعدة بيانات Supabase
    async function handleReset(e) {
      e.preventDefault();
      const pass = document.getElementById("newPass").value;
      const confirmPass = document.getElementById("confirmPass").value;
      const btn = document.getElementById("submitBtn");

      if (pass !== confirmPass) {
        showAlert("⚠️ كلمتا المرور غير متطابقتين!", "alert-error");
        return;
      }

      if (pass.length < 6) {
        showAlert("⚠️ كلمة المرور يجب أن تكون 6 أحرف/أرقام على الأقل.", "alert-error");
        return;
      }

      btn.disabled = true;
      btn.innerText = "جاري تحديث قاعدة البيانات...";

      try {
        const { data, error } = await supabaseClient.auth.updateUser({ password: pass });
        
        if (error) throw error;

        // تسجيل الخروج فوراً لكي لا يُعاد استخدام الرابط مرة أخرى
        await supabaseClient.auth.signOut();

        showAlert("🎉 <b>تم تغيير كلمة المرور بنجاح في قاعدة البيانات!</b><br>يمكنك الآن فتح التطبيق وتسجيل الدخول بكلمة مرورك الجديدة.", "alert-success");
        document.getElementById("resetForm").style.display = "none";

      } catch (err) {
        console.error(err);
        showAlert("⚠️ فشل التحديث: " + (err.message || "تأكد من فتح الرابط من الإيميل."), "alert-error");
        btn.disabled = false;
        btn.innerText = "حفظ وتحديث كلمة المرور 🚀";
      }
    }
  </script>
</body>
</html>
