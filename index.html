<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تعيين كلمة المرور - رحلات الجزائر 🇩🇿</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #0B150F;
      color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #14241B;
      border: 1px solid #10B981;
      border-radius: 20px;
      padding: 30px 20px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h2 { margin-bottom: 8px; font-size: 20px; }
    p.sub { font-size: 13px; color: #94A3B8; margin-bottom: 20px; }
    .input-box { margin-bottom: 15px; text-align: right; }
    label { display: block; font-size: 12px; margin-bottom: 5px; color: #E2E8F0; }
    input {
      width: 100%;
      padding: 12px;
      background: #0B150F;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #FFF;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #10B981; }
    button {
      width: 100%;
      padding: 14px;
      background: #10B981;
      color: #FFF;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .alert {
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 15px;
      line-height: 1.4;
    }
    .error { background: #7F1D1D; color: #FCA5A5; border: 1px solid #EF4444; }
    .success { background: #064E3B; color: #6EE7B7; border: 1px solid #10B981; }
    .info { background: #1E3A8A; color: #93C5FD; border: 1px solid #3B82F6; }
  </style>
</head>
<body>

  <div class="card">
    <div style="font-size: 40px; margin-bottom: 8px;">🔑🇩🇿</div>
    <h2>تغيير كلمة المرور</h2>
    <p class="sub">منصة رحلات الجزائر</p>

    <div id="msgBox" class="alert info">جاري فحص رابط الاستعادة... ⏳</div>

    <form id="resetForm" onsubmit="submitNewPassword(event)">
      <div class="input-box">
        <label>كلمة المرور الجديدة</label>
        <input type="password" id="p1" placeholder="أدخل كلمة المرور الجديدة" required minlength="6">
      </div>
      <div class="input-box">
        <label>تأكيد كلمة المرور</label>
        <input type="password" id="p2" placeholder="أعد إدخال كلمة المرور" required minlength="6">
      </div>
      <button type="submit" id="btn">حفظ كلمة المرور الجديدة 🚀</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://abzxeetfxnejlurqixun.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFienhlZXRmeG5lamx1cnFpeHVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNTQ5MzIsImV4cCI6MjEwMjczMDkzMn0.7w9NKOvO8yE5sXrjc1uUwLuzvL5uHMFgdm1Uxw1xAUA";

    let token = "";

    function showMsg(text, type) {
      const box = document.getElementById("msgBox");
      box.className = "alert " + type;
      box.innerHTML = text;
      box.style.display = "block";
    }

    // 1. استخراج التوكن بدقة عالية
    function parseToken() {
      // من الـ hash (#access_token=...)
      if (window.location.hash) {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        if (hashParams.get("access_token")) {
          token = hashParams.get("access_token");
        }
      }
      
      // من الـ query (?access_token=...)
      if (!token && window.location.search) {
        const searchParams = new URLSearchParams(window.location.search);
        if (searchParams.get("access_token")) {
          token = searchParams.get("access_token");
        }
      }

      if (token) {
        showMsg("تم التحقق من هويتك بنجاح ✅<br>أدخل كلمة المرور الجديدة واضغط حفظ.", "success");
      } else {
        showMsg("⚠️ لم يتم العثور على رمز الأمان. يرجى فتح الرابط مباشرة من البريد الإلكتروني الذي وصلك.", "error");
        document.getElementById("btn").disabled = true;
      }
    }

    parseToken();

    // 2. تحديث كلمة المرور عبر اتصال REST مباشر وسريع إلى قاعدة البيانات
    async function submitNewPassword(e) {
      e.preventDefault();
      const p1 = document.getElementById("p1").value;
      const p2 = document.getElementById("p2").value;
      const btn = document.getElementById("btn");

      if (p1 !== p2) {
        showMsg("⚠️ كلمتا المرور غير متطابقتين!", "error");
        return;
      }

      if (p1.length < 6) {
        showMsg("⚠️ يجب أن تكون كلمة المرور 6 أحرف على الأقل!", "error");
        return;
      }

      if (!token) {
        showMsg("⚠️ الرابط غير صالح أو انتهت صلاحيته.", "error");
        return;
      }

      btn.disabled = true;
      btn.innerText = "جاري التحديث في قاعدة البيانات...";

      try {
        const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ password: p1 })
        });

        const data = await response.json();

        if (response.ok) {
          showMsg("🎉 <b>تم تغيير كلمة المرور بنجاح!</b><br>يمكنك الآن فتح التطبيق وتسجيل الدخول بكلمة مرورك الجديدة.", "success");
          document.getElementById("resetForm").style.display = "none";
          // إتلاف التوكن لضمان الاستخدام لمرة واحدة
          token = "";
        } else {
          showMsg("⚠️ فشل التحديث: " + (data.msg || data.error_description || data.message || "الرابط منتهي الصلاحية"), "error");
          btn.disabled = false;
          btn.innerText = "حفظ كلمة المرور الجديدة 🚀";
        }
      } catch (err) {
        showMsg("⚠️ حدث خطأ في الاتصال بالسيرفر. حاول مرة أخرى.", "error");
        btn.disabled = false;
        btn.innerText = "حفظ كلمة المرور الجديدة 🚀";
      }
    }
  </script>
</body>
</html>
