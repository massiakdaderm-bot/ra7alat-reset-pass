<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تعيين كلمة المرور - رحلات الجزائر</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: linear-gradient(135deg, #0B150F 0%, #12231A 100%);
      color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: rgba(20, 36, 27, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 24px;
      padding: 36px 24px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: #FFFFFF; }
    p { font-size: 13px; color: #94A3B8; margin-bottom: 20px; line-height: 1.5; }
    .input-group { margin-bottom: 16px; text-align: right; }
    label { display: block; font-size: 12px; font-weight: 600; color: #CBD5E1; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(11, 21, 15, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      color: #FFFFFF;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #10B981; }
    button {
      width: 100%;
      padding: 14px;
      background: #10B981;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background: #059669; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .alert { padding: 12px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; display: none; }
    .alert-error { background: rgba(239, 68, 68, 0.2); color: #FCA5A5; border: 1px solid rgba(239, 68, 68, 0.4); }
    .alert-success { background: rgba(16, 185, 129, 0.2); color: #6EE7B7; border: 1px solid rgba(16, 185, 129, 0.4); }
    .alert-info { background: rgba(59, 130, 246, 0.2); color: #93C5FD; border: 1px solid rgba(59, 130, 246, 0.4); }
  </style>
</head>
<body>

  <div class="card">
    <div style="font-size: 40px; margin-bottom: 10px;">🔑🇩🇿</div>
    <h2>إعادة تعيين كلمة المرور</h2>
    <p>تطبيق رحلات الجزائر</p>

    <div id="alertBox" class="alert"></div>

    <form id="resetForm" onsubmit="handleReset(event)">
      <div class="input-group">
        <label for="newPass">كلمة المرور الجديدة</label>
        <input type="password" id="newPass" placeholder="••••••••" required minlength="6">
      </div>

      <div class="input-group">
        <label for="confirmPass">تأكيد كلمة المرور</label>
        <input type="password" id="confirmPass" placeholder="••••••••" required minlength="6">
      </div>

      <button type="submit" id="submitBtn">حفظ كلمة المرور الجديدة 🚀</button>
    </form>
  </div>

  <script>
    // ضع عنوان مشروعك ومفتاح Anon هنا
    const SUPABASE_URL = "https://fegptgvyvyfckpkhqsqk.supabase.co"; // استبدله برابطك إذا كان مختلفاً
    const SUPABASE_ANON_KEY = "ضع_مفتاح_anon_هنا";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // التحقق من حالة الجلسة عند فتح الصفحة
    supabase.auth.onAuthStateChange(async (event, session) => {
      if (event === "PASSWORD_RECOVERY") {
        showAlert("تم التحقق من هويتك بنجاح، يمكنك الآن تعيين كلمة المرور الجديدة.", "alert-info");
      }
    });

    async function handleReset(e) {
      e.preventDefault();
      const pass = document.getElementById("newPass").value;
      const confirmPass = document.getElementById("confirmPass").value;
      const btn = document.getElementById("submitBtn");

      if (pass !== confirmPass) {
        showAlert("كلمتا المرور غير متطابقتين!", "alert-error");
        return;
      }

      btn.disabled = true;
      btn.innerText = "جاري الحفظ...";

      try {
        const { data, error } = await supabase.auth.updateUser({ password: pass });
        if (error) throw error;

        showAlert("تم تغيير كلمة المرور بنجاح! 🎉 يمكنك الآن فتح التطبيق وتسجيل الدخول.", "alert-success");
        document.getElementById("resetForm").style.display = "none";
      } catch (err) {
        showAlert(err.message || "حدث خطأ. تأكد من فتح الرابط من البريد الإلكتروني.", "alert-error");
        btn.disabled = false;
        btn.innerText = "حفظ كلمة المرور الجديدة";
      }
    }

    function showAlert(msg, type) {
      const box = document.getElementById("alertBox");
      box.className = "alert " + type;
      box.innerText = msg;
      box.style.display = "block";
    }
  </script>
</body>
</html>
